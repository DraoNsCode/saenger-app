<!-- Vergleich zu Baustein B: der in GARTEN-WORTE.md beschriebene Moment, gezeichnet. Die App verlinkt diese Seite nicht, es wird nichts gespeichert. -->
<body class="probe-worte">
  <main class="geraet" aria-label="Der beschriebene Moment">
    <header class="kopf">Lernpfad</header>
    <div class="bild">
      <div class="szene" role="img" aria-label="Garten mit drei Bereichen"></div>
      <p class="schild schild-6" style="--x:22%;--y:13.6%"><span class="zeichen leer" aria-hidden="true"></span>Rhythmus</p>
      <p class="schild schild-5" style="--x:21.5%;--y:83.6%"><span class="zeichen aktuell" aria-hidden="true"></span><span class="schild-text"></span></p>
      <div class="spur" aria-hidden="true"></div>
    </div>
    <div class="fuss">
      <a class="weiter" href="#" role="button"><span></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4l8 8-8 8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    </div>
  </main>
  <form class="wahl" aria-label="Schalter der Probe">
    <p class="wahl-ueber">Probe zu Baustein B: der Garten in Worten</p>
    <p>Gezeichnet nach der Beschreibung in GARTEN-WORTE.md (ungeprüftes Brainstorming). Umschalten lässt sich der Zustand von „Intervalle“, die Nachbarn bleiben unverändert.</p>
    <div class="staende" role="group" aria-label="Zustand des Bereichs"></div>
    <p><a href="garten.html">Zur bisherigen Probe</a></p>
  </form>
